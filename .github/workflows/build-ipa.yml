name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme imguicheat \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/imguicheat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/imguicheat.xcarchive/Products/Applications/imguicheat.app"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd "$RUNNER_TEMP"
          zip -r -y imguicheat-unsigned.ipa Payload
          mkdir -p "${{ github.workspace }}/out"
          mv imguicheat-unsigned.ipa "${{ github.workspace }}/out/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: imguicheat-unsigned-ipa
          path: out/imguicheat-unsigned.ipa
          retention-days: 14
